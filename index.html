<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Rental Pilot</title></head><body><div id="root"></div><script type="module" src="/src/main.jsx"></script><script>document.addEventListener('click',function(e){const btn=e.target.closest('button.method');if(!btn)return;const label=(btn.textContent||'').trim();if(label!=='Custom Amount'&&!label.startsWith('Full Balance'))return;setTimeout(function(){const grid=btn.closest('.method-grid');if(!grid)return;grid.querySelectorAll('button.method').forEach(function(b){const t=(b.textContent||'').trim();if(t==='Custom Amount'||t.startsWith('Full Balance'))b.classList.toggle('active',b===btn);});},0);});</script></body></html>
